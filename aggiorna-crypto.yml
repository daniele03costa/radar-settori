name: Aggiorna crypto

on:
  schedule:
    # ogni giorno, weekend compreso, appena finita la giornata UTC delle crypto
    # (le 2:23 italiane in estate, l'1:23 in inverno) e un secondo passaggio di recupero
    - cron: "23 0 * * *"
    - cron: "53 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# stesso gruppo di «Aggiorna dati»: i due aggiornamenti non girano mai insieme
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Prezzi crypto
        continue-on-error: true
        run: python build_crypto.py

      - name: Salva i dati nel repository
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nessuna novità da salvare"
          else
            git commit -m "Crypto aggiornate $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash || true
            git push
          fi
