name: Aggiorna crypto

on:
  schedule:
    # ogni giorno, weekend compreso, appena finita la giornata UTC delle crypto
    # (le 2:23 italiane in estate, l'1:23 in inverno) e un secondo passaggio di recupero
    - cron: "23 0 * * *"
    - cron: "53 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# stesso gruppo di «Aggiorna dati»: i due aggiornamenti non girano mai insieme
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  crypto:
    # Ubuntu e azioni con versione fissa: niente sorprese quando GitHub cambia quella predefinita
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Prezzi crypto
        continue-on-error: true
        run: python build_crypto.py

      - name: Salva i dati nel repository
        if: always()
        # se nel frattempo il repository è cambiato, rimette i file nuovi sopra la versione aggiornata (niente conflitti)
        run: bash salva_dati.sh "Crypto aggiornate"
