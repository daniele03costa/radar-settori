name: Aggiorna dati

on:
  schedule:
    # dopo la chiusura di Wall Street (lun-ven) e due passaggi di recupero:
    # Yahoo a volte pubblica le chiusure con qualche ora di ritardo
    - cron: "37 22 * * 1-5"
    - cron: "7 1 * * 2-6"
    - cron: "37 5 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    # Ubuntu e azioni con versione fissa: niente sorprese quando GitHub cambia quella predefinita
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa le librerie
        run: pip install -r requirements.txt

      - name: Ampiezza dei settori (titoli sopra le medie)
        continue-on-error: true
        run: python build_data.py

      - name: Prezzi per la rotazione (USA e globali)
        continue-on-error: true
        run: python build_prices.py

      - name: Salva i dati nel repository
        if: always()
        # se nel frattempo il repository è cambiato, rimette i file nuovi sopra la versione aggiornata (niente conflitti)
        run: bash salva_dati.sh "Dati aggiornati"
